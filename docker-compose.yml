services:
  db:
    image: postgres:16
    container_name: finance-pg
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance      # local development only
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./queries.sql:/queries.sql:ro
volumes:
  pgdata:
